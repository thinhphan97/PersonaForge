services:
  avatar-chat:
    build: .
    command:
      ["sh", "-c", "alembic upgrade head && exec uvicorn personaforge_chat.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${APP_HTTP_PORT:-8000}:8000"
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_THIRD_PARTY_LEVEL: ${LOG_THIRD_PARTY_LEVEL:-WARNING}
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:-development}
      LOG_SERVICE_VERSION: ${LOG_SERVICE_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://avatar:avatar@postgres:5432/avatar}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-false}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-avatar_refresh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret-change-me-32-bytes}
      JWT_ISSUER: ${JWT_ISSUER:-avatar-chat}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-avatar-chat-browser}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:18000}
      REPLY_PROVIDER: ${REPLY_PROVIDER:-scripted}
      REPLY_CHUNK_DELAY: ${REPLY_CHUNK_DELAY:-0.25}
      THINKING_MIN_DURATION: ${THINKING_MIN_DURATION:-1.0}
      AV_SYNC_DEBUG: ${AV_SYNC_DEBUG:-true}
      AV_SYNC_INTERVAL: ${AV_SYNC_INTERVAL:-2.0}
      AV_SYNC_PULSE_DURATION: ${AV_SYNC_PULSE_DURATION:-0.1}
      REPLY_HTTP_URL: ${REPLY_HTTP_URL:-}
      REPLY_HTTP_TOKEN: ${REPLY_HTTP_TOKEN:-}
      AGENT_RUNTIME_PROVIDER: ${AGENT_RUNTIME_PROVIDER:-local}
      AGENT_GRPC_TARGET: ${AGENT_GRPC_TARGET:-personaforge-agent:50051}
      AGENT_GRPC_CA_FILE: ${AGENT_GRPC_CA_FILE:-}
      AGENT_GRPC_CLIENT_CERT_FILE: ${AGENT_GRPC_CLIENT_CERT_FILE:-}
      AGENT_GRPC_CLIENT_KEY_FILE: ${AGENT_GRPC_CLIENT_KEY_FILE:-}
      AGENT_TURN_TIMEOUT: ${AGENT_TURN_TIMEOUT:-120}
      AGENT_IDLE_TIMEOUT: ${AGENT_IDLE_TIMEOUT:-15}
      AGENT_DELEGATION_SECRET: ${AGENT_DELEGATION_SECRET:-development-agent-delegation-secret-change-me}
      AGENT_DELEGATION_ISSUER: ${AGENT_DELEGATION_ISSUER:-personaforge-api}
      AGENT_DELEGATION_AUDIENCE: ${AGENT_DELEGATION_AUDIENCE:-personaforge-agent}
      SESSION_TURN_LOCK_PROVIDER: ${SESSION_TURN_LOCK_PROVIDER:-redis}
      SESSION_TURN_LOCK_TIMEOUT: ${SESSION_TURN_LOCK_TIMEOUT:-0}
      SESSION_TURN_LOCK_LEASE: ${SESSION_TURN_LOCK_LEASE:-30}
      WEBRTC_ICE_SERVERS: ${WEBRTC_ICE_SERVERS:-}
      WEBRTC_ICE_USERNAME: ${WEBRTC_ICE_USERNAME:-}
      WEBRTC_ICE_CREDENTIAL: ${WEBRTC_ICE_CREDENTIAL:-}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-aiortc}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-http://livekit:7880}
      LIVEKIT_WORKER_URL: ${LIVEKIT_WORKER_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REALTIME_EVENT_BUS: ${REALTIME_EVENT_BUS:-auto}
      RENDER_WORKER_ID: ${RENDER_WORKER_ID:-avatar-worker-1}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      CONTROL_CORE_TOKEN: ${CONTROL_CORE_TOKEN:-development-core-control-token-change-me}
      PERSONA_PEAK_VRAM_MB: ${PERSONA_PEAK_VRAM_MB:-0}
      PERSONA_GPU_DUTY_CYCLE: ${PERSONA_GPU_DUTY_CYCLE:-0.1}
      AVATAR_CHARACTERS_ROOT: ${AVATAR_CHARACTERS_ROOT:-/app/assets/characters}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  personaforge-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "personaforge_agent.main"]
    profiles: ["agent"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_THIRD_PARTY_LEVEL: ${LOG_THIRD_PARTY_LEVEL:-WARNING}
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:-development}
      LOG_SERVICE_VERSION: ${LOG_SERVICE_VERSION:-0.1.0}
      AGENT_GRPC_HOST: ${AGENT_GRPC_HOST:-0.0.0.0}
      AGENT_GRPC_PORT: ${AGENT_GRPC_PORT:-50051}
      AGENT_GRPC_TLS_CERT_FILE: ${AGENT_GRPC_TLS_CERT_FILE:-}
      AGENT_GRPC_TLS_KEY_FILE: ${AGENT_GRPC_TLS_KEY_FILE:-}
      AGENT_GRPC_TLS_CLIENT_CA_FILE: ${AGENT_GRPC_TLS_CLIENT_CA_FILE:-}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-scripted}
      AGENT_CHUNK_DELAY: ${AGENT_CHUNK_DELAY:-0.1}
      AGENT_HEARTBEAT_INTERVAL: ${AGENT_HEARTBEAT_INTERVAL:-5}
      AGENT_MAX_CONCURRENT_TURNS: ${AGENT_MAX_CONCURRENT_TURNS:-20}
      AGENT_MAX_QUEUED_TURNS: ${AGENT_MAX_QUEUED_TURNS:-100}
      AGENT_MAX_CONCURRENT_PER_USER: ${AGENT_MAX_CONCURRENT_PER_USER:-3}
      AGENT_MAX_CONCURRENT_PER_SESSION: ${AGENT_MAX_CONCURRENT_PER_SESSION:-1}
      AGENT_QUEUE_TIMEOUT: ${AGENT_QUEUE_TIMEOUT:-10}
      AGENT_TURN_REGISTRY_PROVIDER: ${AGENT_TURN_REGISTRY_PROVIDER:-redis}
      AGENT_TURN_CLAIM_LEASE: ${AGENT_TURN_CLAIM_LEASE:-60}
      AGENT_TURN_RESULT_RETENTION: ${AGENT_TURN_RESULT_RETENTION:-86400}
      AGENT_GRACEFUL_SHUTDOWN_TIMEOUT: ${AGENT_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
      AGENT_MAX_MESSAGE_CHARS: ${AGENT_MAX_MESSAGE_CHARS:-20000}
      AGENT_MAX_HISTORY_MESSAGES: ${AGENT_MAX_HISTORY_MESSAGES:-50}
      AGENT_MAX_HISTORY_CHARS: ${AGENT_MAX_HISTORY_CHARS:-100000}
      AGENT_MAX_SCOPES: ${AGENT_MAX_SCOPES:-100}
      AGENT_STATUS_TOKEN: ${AGENT_STATUS_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_DELEGATION_SECRET: ${AGENT_DELEGATION_SECRET:-development-agent-delegation-secret-change-me}
      AGENT_DELEGATION_ISSUER: ${AGENT_DELEGATION_ISSUER:-personaforge-api}
      AGENT_DELEGATION_AUDIENCE: ${AGENT_DELEGATION_AUDIENCE:-personaforge-agent}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import grpc;
          from grpc_health.v1 import health_pb2, health_pb2_grpc;
          channel=grpc.insecure_channel('127.0.0.1:50051');
          response=health_pb2_grpc.HealthStub(channel).Check(
          health_pb2.HealthCheckRequest(
          service='personaforge.agent.v1.AgentRuntime.Liveness'),
          timeout=2);
          assert response.status == health_pb2.HealthCheckResponse.SERVING
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 35s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  personaforge-control:
    build: .
    command:
      ["sh", "-c", "alembic upgrade head && exec uvicorn personaforge_control.main:app --host 0.0.0.0 --port 8090"]
    profiles: ["livekit"]
    ports:
      - "127.0.0.1:${CONTROL_HTTP_PORT:-8090}:8090"
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_THIRD_PARTY_LEVEL: ${LOG_THIRD_PARTY_LEVEL:-WARNING}
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:-development}
      LOG_SERVICE_VERSION: ${LOG_SERVICE_VERSION:-0.1.0}
      CONTROL_HOST: ${CONTROL_HOST:-0.0.0.0}
      CONTROL_PORT: ${CONTROL_PORT:-8090}
      CONTROL_REDIS_ADMIN_URL: ${CONTROL_REDIS_ADMIN_URL:-redis://redis:6379/0}
      CONTROL_REDIS_WORKER_URL: ${CONTROL_REDIS_WORKER_URL:-redis://redis:6379/0}
      CONTROL_ENROLLMENT_JWT_SECRET: ${CONTROL_ENROLLMENT_JWT_SECRET:-development-control-enrollment-secret-change-me}
      CONTROL_ENROLLMENT_ISSUER: ${CONTROL_ENROLLMENT_ISSUER:-personaforge-control}
      CONTROL_ENROLLMENT_AUDIENCE: ${CONTROL_ENROLLMENT_AUDIENCE:-personaforge-render-worker-enrollment}
      CONTROL_OPERATOR_TOKEN: ${CONTROL_OPERATOR_TOKEN:-development-operator-token-change-me}
      CONTROL_CORE_TOKEN: ${CONTROL_CORE_TOKEN:-development-core-control-token-change-me}
      CONTROL_REGISTRATION_TTL_SECONDS: ${CONTROL_REGISTRATION_TTL_SECONDS:-15}
      CONTROL_REDIS_CREDENTIAL_TTL_SECONDS: ${CONTROL_REDIS_CREDENTIAL_TTL_SECONDS:-3600}
      CONTROL_SLOT_LEASE_SECONDS: ${CONTROL_SLOT_LEASE_SECONDS:-30}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-postgresql+asyncpg://avatar:avatar@postgres:5432/avatar}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://avatar:avatar@postgres:5432/avatar}
      CONTROL_TELEMETRY_CONSUMER_NAME: ${CONTROL_TELEMETRY_CONSUMER_NAME:-control-1}
      CONTROL_TELEMETRY_BATCH_SIZE: ${CONTROL_TELEMETRY_BATCH_SIZE:-100}
      CONTROL_TELEMETRY_POLL_SECONDS: ${CONTROL_TELEMETRY_POLL_SECONDS:-1}
      CONTROL_TELEMETRY_CLAIM_IDLE_MS: ${CONTROL_TELEMETRY_CLAIM_IDLE_MS:-30000}
      CONTROL_TELEMETRY_AGGREGATE_SECONDS: ${CONTROL_TELEMETRY_AGGREGATE_SECONDS:-60}
      CONTROL_TELEMETRY_RETENTION_DAYS: ${CONTROL_TELEMETRY_RETENTION_DAYS:-30}
      CONTROL_TELEMETRY_RETENTION_INTERVAL_SECONDS: ${CONTROL_TELEMETRY_RETENTION_INTERVAL_SECONDS:-3600}
      CONTROL_RESOURCE_DEFAULT_PEAK_VRAM_MB: ${CONTROL_RESOURCE_DEFAULT_PEAK_VRAM_MB:-4096}
      CONTROL_RESOURCE_DEFAULT_GPU_DUTY_CYCLE: ${CONTROL_RESOURCE_DEFAULT_GPU_DUTY_CYCLE:-0.25}
      CONTROL_RESOURCE_COMPATIBLE_VRAM_MARGIN_MB: ${CONTROL_RESOURCE_COMPATIBLE_VRAM_MARGIN_MB:-1024}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          assert urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2).status == 200
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avatar}
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  avatar-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: personaforge-avatar-worker:local
    command: ["python", "-m", "personaforge_worker.main"]
    profiles: ["livekit"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_THIRD_PARTY_LEVEL: ${LOG_THIRD_PARTY_LEVEL:-WARNING}
      LOG_ENVIRONMENT: ${LOG_ENVIRONMENT:-development}
      LOG_SERVICE_VERSION: ${LOG_SERVICE_VERSION:-0.1.0}
      PERSONA_WORKER_ROLE: master
      PERSONA_MASTER_SOCKET: ${PERSONA_MASTER_SOCKET:-/run/personaforge/worker-master/control.sock}
      PERSONA_MASTER_MAX_CHILDREN: ${PERSONA_MASTER_MAX_CHILDREN:-32}
      PERSONA_CHILD_HANDSHAKE_TIMEOUT_SECONDS: ${PERSONA_CHILD_HANDSHAKE_TIMEOUT_SECONDS:-10}
      PERSONA_CHILD_HEARTBEAT_INTERVAL_SECONDS: ${PERSONA_CHILD_HEARTBEAT_INTERVAL_SECONDS:-1}
      PERSONA_CHILD_HEARTBEAT_TIMEOUT_SECONDS: ${PERSONA_CHILD_HEARTBEAT_TIMEOUT_SECONDS:-5}
      PERSONA_CHILD_STOP_GRACE_SECONDS: ${PERSONA_CHILD_STOP_GRACE_SECONDS:-10}
      PERSONA_CHILD_COMMAND_QUEUE_SIZE: ${PERSONA_CHILD_COMMAND_QUEUE_SIZE:-100}
      PERSONA_RESOURCE_PROBE_PROVIDER: ${PERSONA_RESOURCE_PROBE_PROVIDER:-auto}
      PERSONA_RESOURCE_PROBE_TIMEOUT_SECONDS: ${PERSONA_RESOURCE_PROBE_TIMEOUT_SECONDS:-3}
      AVATAR_WORKER_ID: ${AVATAR_WORKER_ID:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AVATAR_REGISTRATION_URL: ${AVATAR_REGISTRATION_URL:-}
      AVATAR_WORKER_BOOTSTRAP_TOKEN: ${AVATAR_WORKER_BOOTSTRAP_TOKEN:-}
      AVATAR_WORKER_BOOTSTRAP_TOKEN_FILE: ${AVATAR_WORKER_BOOTSTRAP_TOKEN_FILE:-}
      AVATAR_WORKER_STATE_DIR: ${AVATAR_WORKER_STATE_DIR:-/var/lib/personaforge/avatar-worker}
      AVATAR_HOST_ID: ${AVATAR_HOST_ID:-}
      AVATAR_GPU_UUID: ${AVATAR_GPU_UUID:-GPU-none}
      AVATAR_GPU_NAME: ${AVATAR_GPU_NAME:-CPU or unreported GPU}
      AVATAR_GPU_COMPUTE_CAPABILITY: ${AVATAR_GPU_COMPUTE_CAPABILITY:-0.0}
      AVATAR_GPU_TOTAL_VRAM_MB: ${AVATAR_GPU_TOTAL_VRAM_MB:-0}
      AVATAR_GPU_SCHEDULABLE_VRAM_MB: ${AVATAR_GPU_SCHEDULABLE_VRAM_MB:-0}
      AVATAR_WORKER_MAX_SLOTS: ${AVATAR_WORKER_MAX_SLOTS:-1}
      AVATAR_WORKER_MAX_GPU_COUNT: ${AVATAR_WORKER_MAX_GPU_COUNT:-1}
      AVATAR_WORKER_COMPUTE_BUDGET: ${AVATAR_WORKER_COMPUTE_BUDGET:-0.85}
      AVATAR_WORKER_REGISTRATION_TTL_SECONDS: ${AVATAR_WORKER_REGISTRATION_TTL_SECONDS:-15}
      AVATAR_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${AVATAR_WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
      AVATAR_WORKER_TELEMETRY_STREAM_MAXLEN: ${AVATAR_WORKER_TELEMETRY_STREAM_MAXLEN:-17280}
      AVATAR_GPU_PROBE_PROVIDER: ${AVATAR_GPU_PROBE_PROVIDER:-auto}
      AVATAR_GPU_PROBE_TIMEOUT_SECONDS: ${AVATAR_GPU_PROBE_TIMEOUT_SECONDS:-3}
      AVATAR_GPU_RESERVE_VRAM_MB: ${AVATAR_GPU_RESERVE_VRAM_MB:-512}
      WORKER_VIDEO_WIDTH: ${WORKER_VIDEO_WIDTH:-640}
      WORKER_VIDEO_HEIGHT: ${WORKER_VIDEO_HEIGHT:-360}
      WORKER_VIDEO_FPS: ${WORKER_VIDEO_FPS:-25}
      WORKER_VIDEO_BITRATE: ${WORKER_VIDEO_BITRATE:-1500000}
      WORKER_AUDIO_SAMPLE_RATE: ${WORKER_AUDIO_SAMPLE_RATE:-48000}
      WORKER_AUDIO_FRAME_DURATION: ${WORKER_AUDIO_FRAME_DURATION:-0.02}
      WORKER_VIDEO_QUEUE_MS: ${WORKER_VIDEO_QUEUE_MS:-80}
      TTS_AUDIO_BUFFER_MAX_MS: ${TTS_AUDIO_BUFFER_MAX_MS:-2000}
      SCRIPTED_TTS_MS_PER_CHARACTER: ${SCRIPTED_TTS_MS_PER_CHARACTER:-40}
      AV_SYNC_DEBUG: ${AV_SYNC_DEBUG:-true}
      AV_SYNC_INTERVAL: ${AV_SYNC_INTERVAL:-2.0}
      AV_SYNC_PULSE_DURATION: ${AV_SYNC_PULSE_DURATION:-0.1}
      AVATAR_CHARACTERS_ROOT: ${AVATAR_CHARACTERS_ROOT:-/app/assets/characters}
    depends_on:
      redis:
        condition: service_healthy
      personaforge-control:
        condition: service_healthy
        required: false
      livekit:
        condition: service_started
    volumes:
      - avatar_worker_identity:/var/lib/personaforge/avatar-worker
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    profiles: ["livekit"]
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      NODE_IP: ${LIVEKIT_NODE_IP:-}
      UDP_PORT: ${LIVEKIT_RTC_UDP_PORT:-7882}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_RTC_TCP_PORT:-7881}
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:${LIVEKIT_RTC_UDP_PORT:-7882}/udp"

volumes:
  postgres_data:
  redis_data:
  avatar_worker_identity:
