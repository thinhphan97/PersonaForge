[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-chat-webrtc"
version = "0.1.0"
description = "Hexagonal Python service for a realtime WebRTC avatar chat"
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.13,<2",
    "aiosqlite>=0.21,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "av>=14,<16",
    "fastapi>=0.115,<1",
    "grpcio>=1.81.1,<2",
    "grpcio-health-checking>=1.81.1,<2",
    "httpx>=0.28,<1",
    "livekit>=1.0,<2",
    "livekit-api>=1.0,<2",
    "nvitop>=1.5,<2",
    "pydantic>=2.10,<3",
    "protobuf>=6.33.5,<7",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "grpcio-tools>=1.81.1,<2",
    "ruff>=0.11,<1",
]
e2e = [
    "playwright>=1.54,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "src/personaforge/agent/v1/*_pb2*.py",
    "src/personaforge/worker/v1/*_pb2*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["personaforge_chat", "personaforge_worker", "personaforge_agent", "personaforge_control"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc_health", "grpc_health.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nvitop", "nvitop.*", "livekit", "livekit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["personaforge.agent.v1.*", "personaforge.worker.v1.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "personaforge_chat.adapters.outbound.agent_runtime",
    "personaforge_agent.adapters.inbound.grpc_service",
    "personaforge_agent.main",
    "personaforge_worker.ipc.messages",
    "personaforge_worker.master.child_server",
    "personaforge_worker.master.supervisor",
    "personaforge_worker.child.runtime",
]
ignore_errors = true
