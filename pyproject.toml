[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-chat-webrtc"
version = "0.1.0"
description = "Hexagonal Python service for a realtime WebRTC avatar chat"
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.13,<2",
    "aiosqlite>=0.21,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "av>=14,<16",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "livekit>=1.0,<2",
    "livekit-api>=1.0,<2",
    "pydantic>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]
e2e = [
    "playwright>=1.54,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["avatar_chat", "avatar_worker"]
